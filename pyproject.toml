[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-PHAL-plugin-netpolicy"
version = "0.0.0a1"
description = "PHAL admin plugin: per-service network policy for OVOS, with enforced Tor routing (design stage)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.9"
dependencies = [
    "ovos-plugin-manager",
    "ovos-bus-client",
]

[project.optional-dependencies]
# planned: backends as separate packages
tor = ["stem"]  # -> "ovos-netpolicy-backend-tor"
# tor-bundled = ["ovos-netpolicy-backend-tor", "ovos-netpolicy-tor-bin"]
# wireguard = ["ovos-netpolicy-backend-wireguard"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-PHAL-plugin-netpolicy"

[project.entry-points."opm.phal.admin"]
"ovos-PHAL-plugin-netpolicy" = "ovos_phal_plugin_netpolicy:NetPolicyAdminPlugin"

[tool.setuptools]
packages = ["ovos_phal_plugin_netpolicy"]
